# SonarCloud / SonarQube settings for backend and frontend.
# Run the scan FROM THE REPO ROOT with:
#   -Dproject.settings=qa/09-quality-metrics/sonar-project.properties
# Before the first scan, replace the two REPLACE_ME values (see sonarcloud-steps.md).

sonar.organization=REPLACE_ME_ORGANIZATION
sonar.projectKey=REPLACE_ME_PROJECT_KEY
sonar.projectName=Lab Safety Platform QA
# The scanner's base directory is the repo root, so all paths below start there.

# Application under test
sonar.sources=backend,frontend/src
# QA tests (kept separate, so they do not count as application code)
sonar.tests=qa/05-tdd-bdd,qa/06-automation-cicd

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.md
sonar.test.exclusions=**/node_modules/**,**/*.md,**/*.log

# Jest (backend) coverage. The SF: paths inside lcov.info must be relative to
# the repo root, for example SF:backend/app.js
sonar.javascript.lcov.reportPaths=qa/coverage/lcov.info

# The frontend has no unit tests, only Selenium. seed.js only loads demo data.
sonar.coverage.exclusions=frontend/**,backend/seed.js

sonar.sourceEncoding=UTF-8
